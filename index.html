<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tagwerk</title>
<meta name="description" content="Privates Journal mit Vitalwerten, Ernährung und Training. Alle Daten bleiben auf diesem Gerät.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tagwerk">
<meta name="theme-color" content="#F3EEE6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1512" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
/* Layout: eine Spalte (max. 560px), Datumsleiste oben fixiert, Tab-Leiste unten. Systemschriften statt Webfonts: keine Anfragen an Dritte. */
:root{
  --bg:#F3EEE6; --surface:#FBF8F3; --surface-2:#ECE4D8; --ink:#2B211A; --muted:#7A6A5B; --line:#E2D7C8;
  --accent:#6B4A33; --accent-soft:#EADFD1; --on-accent:#FBF8F3;
  --honey:#9A6B30; --honey-soft:#F1E5D1; --heart:#9E4B3C; --heart-soft:#F3E2DB; --sky:#5D6B73; --sky-soft:#E6E6E1;
  --shadow:0 1px 2px rgba(43,33,26,.05), 0 8px 24px rgba(43,33,26,.06);
  --f-display: ui-serif, "New York", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --f-body: -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --f-quote: ui-serif, "New York", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --r:20px; --r-s:12px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1A1512; --surface:#241D18; --surface-2:#2F2620; --ink:#EFE6DA; --muted:#A8988A; --line:#3B3129;
    --accent:#C9A27E; --accent-soft:#3A2E25; --on-accent:#1A1512;
    --honey:#D6AA6C; --honey-soft:#3A2F22; --heart:#D98A7A; --heart-soft:#3D2722; --sky:#A6B3BA; --sky-soft:#283034;
    --shadow:none; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1A1512; --surface:#241D18; --surface-2:#2F2620; --ink:#EFE6DA; --muted:#A8988A; --line:#3B3129;
    --accent:#C9A27E; --accent-soft:#3A2E25; --on-accent:#1A1512;
    --honey:#D6AA6C; --honey-soft:#3A2F22; --heart:#D98A7A; --heart-soft:#3D2722; --sky:#A6B3BA; --sky-soft:#283034;
    --shadow:none; color-scheme: dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.app{max-width:560px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 calc(96px + env(safe-area-inset-bottom, 0px))}

/* Kopfzeile */
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding-top:calc(10px + env(safe-area-inset-top, 0px));padding-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-weight:600;font-size:19px;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.brand-dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.datebar{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.datebar button.arrow{width:34px;height:34px;border:0;background:transparent;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.datebar button.arrow:disabled{opacity:.3}
.datebar .datelabel{position:relative;padding:0 6px;font-weight:600;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.datebar .datelabel input{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:0;-webkit-appearance:none}

h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h1{font-size:32px;line-height:1.15;font-weight:600;letter-spacing:-.005em}
h2{font-size:20px;font-weight:700}
h3{font-size:16px;font-weight:650}
.eyebrow{font-size:12px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.section{display:flex;flex-direction:column;gap:12px;margin-top:22px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}

.card{background:var(--surface);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);border:1px solid var(--line)}
.hero{padding-top:8px;display:flex;flex-direction:column;gap:4px}

/* Gedanke des Tages */
.quote{position:relative;overflow:hidden;border-radius:var(--r);padding:22px 20px 20px;background:linear-gradient(155deg,var(--honey-soft) 0%,var(--surface) 70%);border:1px solid var(--line)}
.quote .eyebrow{color:var(--honey)}
.quote blockquote{margin:10px 0 12px;font-family:var(--f-quote);font-size:21px;line-height:1.38;letter-spacing:-.005em}
.quote figcaption{font-size:14px;color:var(--muted)}
.quote .sun{position:absolute;right:-26px;top:-26px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,var(--honey) 0%,transparent 68%);opacity:.18;pointer-events:none}

/* Kacheln */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0;box-shadow:var(--shadow)}
.tile.wide{grid-column:1/-1}
.tile .label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.tile .val{font-family:var(--f-display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .val small{font-size:13px;font-weight:500;color:var(--muted);margin-left:3px;font-family:var(--f-body)}
.tile .sub{font-size:13px;color:var(--muted)}
.tile .empty{font-size:15px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}

.pips{display:flex;gap:4px}
.pips i{width:16px;height:6px;border-radius:99px;background:var(--surface-2)}
.pips i.on{background:var(--accent)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 18px;font-weight:650;background:var(--accent);color:var(--on-accent);min-height:48px}
.btn.secondary{background:var(--accent-soft);color:var(--accent)}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.danger{background:var(--heart-soft);color:var(--heart)}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.link{background:none;border:0;padding:4px 0;color:var(--accent);font-weight:600;font-size:14px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick .btn{justify-content:flex-start;padding:12px 14px}

/* Banner */
.banner{display:flex;gap:12px;align-items:flex-start;background:var(--sky-soft);border-radius:16px;padding:14px;border:1px solid var(--line)}
.banner p{margin:2px 0 8px;font-size:14px}

/* Journal */
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:58px}
.scale button b{font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums}
.scale button span{font-size:11px;color:var(--muted);line-height:1.2;text-align:center}
.scale button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.scale button.on span{color:var(--on-accent);opacity:.85}
.q{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.q.done{border-color:color-mix(in srgb, var(--accent) 45%, var(--line))}
.q-head{display:flex;align-items:center;gap:8px}
.q-num{font-family:var(--f-display);font-weight:700;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:34px}
.q-text{font-family:var(--f-display);font-size:18px;font-weight:600;line-height:1.35}
.q .link{margin-left:auto}
.chip{font-size:12px;font-weight:650;padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip[data-cat="dank"]{background:var(--honey-soft);color:var(--honey)}
.chip[data-cat="koerper"]{background:var(--heart-soft);color:var(--heart)}
.chip[data-cat="ziel"]{background:var(--accent-soft);color:var(--accent)}
.chip[data-cat="lernen"]{background:var(--sky-soft);color:var(--sky)}

textarea,input[type=text],input[type=number],input[type=time],input[type=search],select{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r-s);padding:12px;font-size:16px;line-height:1.45;-webkit-appearance:none;appearance:none}
textarea{resize:none;min-height:52px;overflow:hidden}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--accent);background:var(--surface)}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}

/* Segment */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:10px;padding:9px 6px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* Einträge */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.entry{display:flex;gap:12px;align-items:center;padding:14px 16px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;width:100%}
.entry:first-child{border-top:0}
.entry .time{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);width:44px;flex:none}
.entry .main{flex:1;min-width:0}
.entry .main b{font-weight:650}
.entry .main .sub{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry .chev{color:var(--muted);flex:none}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:650;padding:2px 8px;border-radius:99px}
.badge.heart{background:var(--heart-soft);color:var(--heart)}
.badge.sky{background:var(--sky-soft);color:var(--sky)}
.badge.honey{background:var(--honey-soft);color:var(--honey)}
.badge.acc{background:var(--accent-soft);color:var(--accent)}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sum div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;min-width:0}
.sum b{display:block;font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums}
.sum span{font-size:12px;color:var(--muted)}
.emptybox{border:1.5px dashed var(--line);border-radius:var(--r);padding:22px 18px;text-align:center;color:var(--muted);font-size:15px}

/* Diagramme */
.chart{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 14px 10px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--f-body);font-variant-numeric:tabular-nums}
.chart .grid{stroke:var(--line);stroke-width:1}

/* Sheet */
.backdrop{position:fixed;inset:0;background:rgba(26,18,12,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:90vh;max-height:90dvh;overflow:auto;border-radius:24px 24px 0 0;padding-block:10px calc(22px + env(safe-area-inset-bottom, 0px));padding-left:max(18px, env(safe-area-inset-left, 0px));padding-right:max(18px, env(safe-area-inset-right, 0px));animation:up .22s ease;overscroll-behavior:contain}
.grabber{width:40px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 12px}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:13px;font-weight:600;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font-size:15px;font-weight:550}
.chips button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.err{color:var(--heart);font-size:14px;font-weight:600}
.answers{display:flex;flex-direction:column;gap:12px}
.answers .a-q{font-weight:650;font-family:var(--f-display)}
.answers p{margin:2px 0 0;white-space:pre-wrap}

/* Tab-Leiste */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb, var(--surface) 92%, transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom, 0px);padding-left:env(safe-area-inset-left, 0px);padding-right:env(safe-area-inset-right, 0px)}
.tabbar nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabbar button{border:0;background:transparent;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted)}
.tabbar button svg{width:24px;height:24px}
.tabbar button.on{color:var(--accent)}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:14px;font-weight:600;z-index:80;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2);animation:up .2s ease}
.footer-note{font-size:13px;color:var(--muted);text-align:center;margin-top:28px}
ol.steps{margin:6px 0 0;padding-left:20px;font-size:15px}
ol.steps li{margin:4px 0}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><span class="brand-dot"></span>Tagwerk</div>
    <div class="datebar" id="datebar">
      <button class="arrow" id="prevDay" aria-label="Vorheriger Tag"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <label class="datelabel"><span id="dateText">Heute</span><input type="date" id="datePick" aria-label="Datum wählen"></label>
      <button class="arrow" id="nextDay" aria-label="Nächster Tag"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
    </div>
  </header>
  <main id="main"></main>
</div>

<div class="tabbar"><nav id="tabs">
  <button data-tab="heute"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>Heute</button>
  <button data-tab="journal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3"/><path d="M9 8h6M9 11.5h4"/></svg>Journal</button>
  <button data-tab="koerper"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20.4 5.6a5 5 0 0 0-7.1 0L12 6.9l-1.3-1.3a5 5 0 0 0-7.1 7.1L12 21l8.4-8.3a5 5 0 0 0 0-7.1z"/><path d="M3.5 12h4l1.8-3 3 6 1.7-3h6.5"/></svg>Körper</button>
  <button data-tab="verlauf"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 6-7"/></svg>Verlauf</button>
  <button data-tab="daten"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 10.5v5M9.8 13.3L12 15.5l2.2-2.2"/></svg>Daten</button>
</nav></div>

<div id="sheetRoot"></div>
<div id="toastRoot"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script>
'use strict';
/* =========================================================================
   Inhalte
   Fragen-IDs ergeben sich aus Kategorie + Position. Neue Fragen nur ANHÄNGEN,
   nie einfügen oder umsortieren, sonst passen alte Antworten nicht mehr.
   ========================================================================= */
const CATS = {dank:'Dankbarkeit', gefuehl:'Gefühle', erfolg:'Erfolge', lernen:'Lernen', bez:'Menschen', koerper:'Körper', ziel:'Potenzial'};
const QRAW = {
dank:[
'Wofür bist du heute dankbar, das du sonst für selbstverständlich hältst?',
'Welcher Mensch hat deinen Tag heute ein Stück besser gemacht?',
'Welcher kleine Moment hat dich heute zum Lächeln gebracht?',
'Was hat dein Körper heute gut für dich geleistet?',
'Welche Annehmlichkeit hast du heute genutzt, die vielen Menschen fehlt?',
'Wofür bist du an deinem Zuhause dankbar?',
'Welches Essen hast du heute besonders genossen?',
'Was hat dir heute jemand geschenkt: Zeit, Hilfe oder ein gutes Wort?',
'Welche deiner Fähigkeiten hat dir heute geholfen?',
'Was ist dir heute in der Natur aufgefallen?',
'Welche Erinnerung macht dich heute dankbar?',
'Welches Problem ist heute nicht eingetreten, obwohl es hätte passieren können?',
'Wem könntest du heute ein ehrliches Danke sagen, und wofür?',
'Was schätzt du heute an deiner Arbeit?',
'Welche Entscheidung aus der Vergangenheit zahlt sich heute aus?',
'Welche Freundschaft bereichert gerade dein Leben?',
'Was hat dir heute Ruhe geschenkt?',
'Welcher Geruch, Klang oder Geschmack hat dir heute gutgetan?',
'Was hast du heute gelernt, wofür du dankbar bist?',
'Welcher Gegenstand erleichtert dir den Alltag, ohne dass du ihn bemerkst?',
'Wofür bist du dir selbst heute dankbar?',
'Welche Schwierigkeit hat dich im Rückblick stärker gemacht?',
'Was hat heute einfach funktioniert?',
'Welche Freiheit hattest du heute?',
'Welcher Mensch glaubt an dich?',
'Was magst du an der aktuellen Jahreszeit?',
'Welches Gespräch war heute wertvoll?',
'Was würdest du vermissen, wenn es morgen weg wäre?',
'Wofür bist du bei deiner Gesundheit gerade dankbar?',
'Welche Chance liegt gerade vor dir?'
],
gefuehl:[
'Welches Gefühl hat deinen Tag am stärksten geprägt?',
'Wann hast du dich heute am lebendigsten gefühlt?',
'Was hat dich heute Energie gekostet?',
'Was hat dir heute Energie gegeben?',
'Gab es einen Moment, in dem du gereizt warst? Was lag darunter?',
'Worüber machst du dir gerade Sorgen, und wie wahrscheinlich ist es wirklich?',
'Was hat dich heute überrascht?',
'Wann warst du heute ganz im Moment?',
'Welches Gefühl hast du heute weggeschoben?',

function blank(){ return {v:1, settings:{glucose:'mg/dL', lastBackup:null}, days:{}, vitals:[], meals:[], workouts:[]}; }
function normalize(d){
  const b = blank(); d = d && typeof d === 'object' ? d : {};
  return {
    v:1,

    days: d.days && typeof d.days === 'object' && !Array.isArray(d.days) ? d.days : {},
    vitals: Array.isArray(d.vitals) ? d.vitals : [],

}
function load(){
  try { const raw = localStorage.getItem(KEY); return raw ? normalize(JSON.parse(raw)) : blank(); }
  catch(e){ storageOk = false; return blank(); }
}

  clearTimeout(saveTimer); saveTimer = null;

const fromYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };

const fmtNum = (n, d = 0) => n == null ? '–' : n.toLocaleString('de-DE', {maximumFractionDigits:d, minimumFractionDigits:0});

function seeded(str){
  let h = 2166136261;
  for (let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  let a = h >>> 0;
  return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function shuffle(arr, r){ const a = arr.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function recentIds(d, span = 7){
  const s = new Set();
  for (let i = 1; i <= span; i++){ const day = S.days[addDays(d, -i)]; if (day && day.q) day.q.forEach(id => s.add(id)); }
  return s;
}
function pickQuestions(d){
  const r = seeded('tagwerk|' + d);
  const recent = recentIds(d);
  let pool = QUESTIONS.filter(q => !recent.has(q.id));
  if (pool.length < 30 || pool.filter(q => q.cat === 'dank').length < 3){
    const yesterday = new Set((S.days[addDays(d, -1)] || {}).q || []);
    pool = QUESTIONS.filter(q => !yesterday.has(q.id));
  }
  pool = shuffle(pool, r);
  const out = [], count = {};
  const take = q => { out.push(q.id); count[q.cat] = (count[q.cat] || 0) + 1; };
  pool.filter(q => q.cat === 'dank').slice(0, 3).forEach(take);
  for (const q of pool){ if (out.length >= 10) break; if (out.includes(q.id) || q.cat === 'dank') continue; if ((count[q.cat] || 0) >= 2) continue; take(q); }
  for (const q of pool){ if (out.length >= 10) break; if (!out.includes(q.id)) take(q); }
  let mixed = shuffle(out, r);
  const zi = mixed.findIndex(id => QMAP[id].cat === 'ziel');
  if (zi > -1){ const [z] = mixed.splice(zi, 1); mixed.push(z); }  // mit einem Blick nach vorn enden
  return mixed;
}
function ensureQuestions(d){
  const day = ensureDay(d);
  day.q = (day.q || []).filter(id => QMAP[id]);
  if (day.q.length < 10){ day.q = pickQuestions(d); save(); }
  return day;
}
function swapQuestion(d, id){
  const day = ensureDay(d);
  const recent = recentIds(d);
  let cands = QUESTIONS.filter(q => !day.q.includes(q.id) && !recent.has(q.id) && q.cat === QMAP[id].cat);
  if (!cands.length) cands = QUESTIONS.filter(q => !day.q.includes(q.id) && !recent.has(q.id));
  if (!cands.length) cands = QUESTIONS.filter(q => !day.q.includes(q.id));
  const n = cands[Math.floor(Math.random() * cands.length)];
  day.q[day.q.indexOf(id)] = n.id;
  delete day.a[id];
  save();
}
function quoteFor(d, part){
  const idx = i => Math.floor(seeded('quote|' + d + '|' + i)() * QUOTES.length);
  let i = idx('morgen');
  if (part === 'abend'){ const j = idx('abend'); i = j === i ? (j + 1) % QUOTES.length : j; }
  return QUOTES[i];
}

const chev = () => `<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>`;
const plus = () => `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>`;

/* ---------- Verlauf ---------- */
function niceStep(x){ const p = Math.pow(10, Math.floor(Math.log10(x))); const f = x / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; }
function chartSvg(dates, series, opt = {}){
  const W = 340, H = 156, pl = 34, pr = 10, pt = 10, pb = 24;
  const iw = W - pl - pr, ih = H - pt - pb, n = dates.length;
  const all = series.flatMap(s => s.values).filter(v => v != null);
  let lo = opt.min ?? Math.min(...all), hi = opt.max ?? Math.max(...all);
  if (opt.zero) lo = 0;
  if (lo === hi){ lo -= 1; hi += 1; }
  const step = opt.step || niceStep((hi - lo) / 3);
  if (opt.min == null) lo = Math.floor(lo / step) * step;
  if (opt.max == null) hi = Math.ceil(hi / step) * step;
  const x = i => pl + (n === 1 ? iw / 2 : i * iw / (n - 1));
  const y = v => pt + ih - (v - lo) / (hi - lo) * ih;
  let g = '';
  for (let v = lo; v <= hi + 1e-9; v += step){ g += `<line class="grid" x1="${pl}" x2="${W - pr}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text x="${pl - 6}" y="${(y(v) + 3.5).toFixed(1)}" text-anchor="end">${fmtNum(v, step < 1 ? 1 : 0)}</text>`; }
  const xl = [0, Math.floor((n - 1) / 2), n - 1].filter((v, i, a) => a.indexOf(v) === i);
  xl.forEach(i => { g += `<text x="${x(i).toFixed(1)}" y="${H - 6}" text-anchor="${i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle'}">${esc(fmtShort(dates[i]))}</text>`; });
  let marks = '';
  series.forEach(s => {
    if (opt.bars){
      const bw = Math.max(2, iw / n * 0.62);
      s.values.forEach((v, i) => { if (v == null || v === 0) return; const yy = y(v); marks += `<rect x="${(x(i) - bw / 2).toFixed(1)}" y="${yy.toFixed(1)}" width="${bw.toFixed(1)}" height="${(pt + ih - yy).toFixed(1)}" rx="${Math.min(3, bw / 2).toFixed(1)}" fill="${s.color}"/>`; });
      return;
    }
    let d = '', open = false;
    s.values.forEach((v, i) => { if (v == null){ open = false; return; } d += (open ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1) + ' '; open = true; });
    // Lücken überbrücken, damit einzelne Messtage eine Linie ergeben
    const pts = s.values.map((v, i) => v == null ? null : [x(i), y(v)]).filter(Boolean);
    if (pts.length > 1) marks += `<path d="${pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ')}" fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" opacity=".9"/>`;
    pts.forEach((p, i) => { const last = i === pts.length - 1; marks += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${last ? 4 : (n > 45 ? 1.8 : 2.6)}" fill="${last ? s.color : 'var(--surface)'}" stroke="${s.color}" stroke-width="1.8"/>`; });
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.label || 'Diagramm')}">${g}${marks}</svg>`;
}
function chartCard(title, dates, series, opt){
  if (!series.some(s => s.values.some(v => v != null && v !== 0))) return '';
  const lastVals = series.map(s => { const v = [...s.values].reverse().find(v => v != null); return v; });
  return `<div class="chart stack" style="gap:8px"><div class="row between wrap"><h3>${title}</h3><div class="legend">${series.map((s, i) => `<span><i class="dot" style="background:${s.color}"></i>${s.name}${lastVals[i] != null && !opt.bars ? ': ' + fmtNum(lastVals[i], opt.dec || 0) : ''}</span>`).join('')}</div></div>${chartSvg(dates, series, Object.assign({label:title}, opt))}</div>`;
}
function vVerlauf(){
  const t = today();
  const dates = []; for (let i = range - 1; i >= 0; i--) dates.push(addDays(t, -i));
  const byDate = (arr, f) => dates.map(d => f(arr.filter(x => x.date === d)));
  const mood = dates.map(d => (S.days[d] || {}).mood ?? null);
  const energy = dates.map(d => (S.days[d] || {}).energy ?? null);
  const sys = byDate(S.vitals, a => { const v = avg(a.map(x => x.sys)); return v == null ? null : Math.round(v); });
  const dia = byDate(S.vitals, a => { const v = avg(a.map(x => x.dia)); return v == null ? null : Math.round(v); });
  const pulse = byDate(S.vitals, a => { const v = avg(a.map(x => x.pulse)); return v == null ? null : Math.round(v); });
  const glu = byDate(S.vitals, a => { const v = avg(a.map(x => x.glu)); return v == null ? null : gluShow(v); });
  const weight = byDate(S.vitals, a => { const w = a.filter(x => x.weight != null).sort(byTime); return w.length ? w[w.length - 1].weight : null; });
  const kcal = byDate(S.meals, a => a.some(x => x.kcal != null) ? sum(a.map(x => x.kcal)) : null);
  const train = byDate(S.workouts, a => a.length ? sum(a.map(x => x.dur)) : null);

  const charts = [
    chartCard('Stimmung & Energie', dates, [{name:'Stimmung', color:'var(--accent)', values:mood}, {name:'Energie', color:'var(--honey)', values:energy}], {min:1, max:5, step:1}),
    chartCard('Blutdruck', dates, [{name:'Systolisch', color:'var(--heart)', values:sys}, {name:'Diastolisch', color:'var(--sky)', values:dia}], {}),
    chartCard('Puls', dates, [{name:'bpm', color:'var(--heart)', values:pulse}], {}),
    chartCard('Blutzucker', dates, [{name:gluUnit(), color:'var(--sky)', values:glu}], {dec:gluUnit() === 'mmol/L' ? 1 : 0}),
    chartCard('Gewicht', dates, [{name:'kg', color:'var(--accent)', values:weight}], {dec:1}),
    chartCard('Kalorien pro Tag', dates, [{name:'kcal', color:'var(--honey)', values:kcal}], {bars:true, zero:true}),
    chartCard('Training pro Tag', dates, [{name:'Minuten', color:'var(--accent)', values:train}], {bars:true, zero:true})
  ].filter(Boolean).join('');

  const allDates = new Set([...Object.keys(S.days).filter(d => dayHasContent(S.days[d])), ...S.vitals.map(x => x.date), ...S.meals.map(x => x.date), ...S.workouts.map(x => x.date)]);
  const listDates = [...allDates].filter(d => d >= dates[0]).sort().reverse();
  const rows = listDates.map(d => {
    const day = dayObj(d); const a = answeredCount(day);
    const b = [];
    if (day.mood != null) b.push(`<span class="badge acc">${MOOD[day.mood - 1]}</span>`);
    if (a) b.push(`<span class="badge honey">${a}/10 Fragen</span>`);
    const vv = S.vitals.filter(x => x.date === d).length; if (vv) b.push(`<span class="badge heart">${vv} Messung${vv > 1 ? 'en' : ''}</span>`);
    const wm = sum(S.workouts.filter(x => x.date === d).map(x => x.dur)); if (wm) b.push(`<span class="badge sky">${wm} min</span>`);
    return `<button class="entry" data-act="day" data-date="${d}"><span class="main"><b>${esc(fmtBar(d))}</b><div class="row wrap" style="gap:6px;margin-top:4px">${b.join('')}</div></span>${chev()}</button>`;
  }).join('');

  return `
  <section class="hero"><span class="eyebrow">Trends</span><h1>Verlauf</h1></section>
  <div class="section"><div class="seg">${[7, 30, 90].map(r => `<button class="${range === r ? 'on' : ''}" data-act="range" data-range="${r}">${r} Tage</button>`).join('')}</div></div>
  <div class="section">${charts || `<div class="emptybox">Hier erscheinen deine Kurven, sobald du ein paar Tage eingetragen hast: Stimmung, Blutdruck, Puls, Blutzucker, Kalorien und Training.</div>`}</div>
  <div class="section"><h2>Einträge</h2>${rows ? `<div class="list">${rows}</div>` : `<div class="emptybox">Noch keine Einträge in diesem Zeitraum.</div>`}</div>`;
}

  $('#sheetRoot').querySelectorAll('textarea').forEach(autosize);
}
function closeSheet(){ $('#sheetRoot').innerHTML = ''; document.body.style.overflow = ''; }
const val = v => v == null ? '' : String(v).replace('.', ',');
function sheetHead(title, sub){ return `<div class="row between" style="margin-bottom:14px"><div><h2>${title}</h2><span class="muted small">${esc(sub)}</span></div><button class="link" data-act="close">Abbrechen</button></div>`; }
function delBtn(id){ return id ? `<button type="button" class="btn danger block" data-act="del" data-id="${id}">Eintrag löschen</button>` : ''; }

    <div class="grid3">
      <label class="field"><span>Systolisch</span><input type="text" inputmode="numeric" name="sys" value="${val(x.sys)}" placeholder="120" autofocus></label>
      <label class="field"><span>Diastolisch</span><input type="text" inputmode="numeric" name="dia" value="${val(x.dia)}" placeholder="80"></label>
      <label class="field"><span>Puls</span><input type="text" inputmode="numeric" name="pulse" value="${val(x.pulse)}" placeholder="62"></label>
    </div>
    <div class="grid2">
      <label class="field"><span>Blutzucker (${gluUnit()})</span><input type="text" inputmode="decimal" name="glu" value="${x.glu != null ? val(gluShow(x.glu)) : ''}" placeholder="${gluUnit() === 'mmol/L' ? '5,4' : '95'}"></label>
      <label class="field"><span>Gewicht (kg)</span><input type="text" inputmode="decimal" name="weight" value="${val(x.weight)}" placeholder="78,5"></label>
    </div>
    <label class="field"><span>Notiz</span><input type="text" name="note" value="${esc(x.note || '')}" placeholder="z. B. nüchtern, nach dem Sport"></label>
    <p class="err" id="formErr" hidden></p>
    <button class="btn block" type="submit">Speichern</button>
    ${delBtn(x.id)}
  </form>`);
}
function sheetMeal(x){
  x = x || {time:nowTime(), type:guessMeal()};
  openSheet(`${sheetHead(x.id ? 'Mahlzeit bearbeiten' : 'Mahlzeit eintragen', fmtLong(x.date || sel))}
  <form class="form" data-form="meal" novalidate>
    <input type="hidden" name="id" value="${esc(x.id || '')}">
    <input type="hidden" name="type" value="${esc(x.type)}">
    <div class="chips" data-pick="type">${MEALS.map(m => `<button type="button" class="${x.type === m ? 'on' : ''}" data-act="pick" data-val="${m}">${m}</button>`).join('')}</div>
    <label class="field"><span>Was gab es?</span><textarea name="desc" rows="2" placeholder="z. B. Haferflocken mit Beeren und Joghurt">${esc(x.desc || '')}</textarea></label>
    <div class="grid2">
      <label class="field"><span>Kalorien (kcal)</span><input type="text" inputmode="numeric" name="kcal" value="${val(x.kcal)}" placeholder="450"></label>
      <label class="field"><span>Uhrzeit</span><input type="time" name="time" value="${esc(x.time || '')}"></label>
    </div>
    <div class="grid3">
      <label class="field"><span>Eiweiß (g)</span><input type="text" inputmode="decimal" name="p" value="${val(x.p)}"></label>
      <label class="field"><span>Kohlenh. (g)</span><input type="text" inputmode="decimal" name="c" value="${val(x.c)}"></label>
      <label class="field"><span>Fett (g)</span><input type="text" inputmode="decimal" name="f" value="${val(x.f)}"></label>
    </div>
    <p class="err" id="formErr" hidden></p>
    <button class="btn block" type="submit">Speichern</button>
    ${delBtn(x.id)}
  </form>`);
}
function sheetWorkout(x){
  x = x || {type:'Laufen', int:'mittel'};
  openSheet(`${sheetHead(x.id ? 'Training bearbeiten' : 'Training eintragen', fmtLong(x.date || sel))}
  <form class="form" data-form="workout" novalidate>
    <input type="hidden" name="id" value="${esc(x.id || '')}">
    <input type="hidden" name="type" value="${esc(x.type)}">
    <input type="hidden" name="int" value="${esc(x.int)}">
    <div class="field"><span>Art</span><div class="chips" data-pick="type">${SPORTS.map(m => `<button type="button" class="${x.type === m ? 'on' : ''}" data-act="pick" data-val="${m}">${m}</button>`).join('')}</div></div>
    <div class="grid2">
      <label class="field"><span>Dauer (Minuten)</span><input type="text" inputmode="numeric" name="dur" value="${val(x.dur)}" placeholder="45"></label>
      <label class="field"><span>Distanz (km, optional)</span><input type="text" inputmode="decimal" name="dist" value="${val(x.dist)}"></label>
    </div>
    <div class="field"><span>Intensität</span><div class="chips" data-pick="int">${INTENS.map(m => `<button type="button" class="${x.int === m ? 'on' : ''}" data-act="pick" data-val="${m}">${m}</button>`).join('')}</div></div>
    <label class="field"><span>Notiz</span><textarea name="note" rows="2" placeholder="z. B. Oberkörper, 4×10 Bankdrücken, fühlte mich stark">${esc(x.note || '')}</textarea></label>
    <p class="err" id="formErr" hidden></p>
    <button class="btn block" type="submit">Speichern</button>
    ${delBtn(x.id)}
  </form>`);
}
function guessMeal(){ const h = new Date().getHours(); return h < 11 ? 'Frühstück' : h < 15 ? 'Mittag' : h < 17 ? 'Snack' : 'Abend'; }
function sheetDay(d){
  const day = dayObj(d);
  const answers = (day.q || []).filter(id => day.a && day.a[id] && day.a[id].trim() && QMAP[id]).map(id => `<div><div class="a-q">${esc(QMAP[id].t)}</div><p>${esc(day.a[id])}</p></div>`).join('');
  const v = S.vitals.filter(x => x.date === d).sort(byTime);
  const m = S.meals.filter(x => x.date === d).sort(byTime);
  const w = S.workouts.filter(x => x.date === d);
  openSheet(`${sheetHead(esc(fmtLong(d)), '')}
  <div class="stack">
    ${day.mood != null || day.energy != null ? `<div class="row wrap" style="gap:6px">${day.mood != null ? `<span class="badge acc">Stimmung: ${MOOD[day.mood - 1]}</span>` : ''}${day.energy != null ? `<span class="badge honey">Energie: ${ENERGY[day.energy - 1]}</span>` : ''}</div>` : ''}
    ${answers ? `<div class="card answers">${answers}</div>` : ''}
    ${day.note && day.note.trim() ? `<div class="card answers"><div><div class="a-q">Freier Eintrag</div><p>${esc(day.note)}</p></div></div>` : ''}
    ${v.length ? `<div class="card answers"><div class="a-q">Messwerte</div>${v.map(x => `<p>${esc(x.time || '')} · ${[x.sys != null ? x.sys + '/' + x.dia + ' mmHg' : '', x.pulse != null ? x.pulse + ' bpm' : '', x.glu != null ? gluStr(x.glu) + ' ' + gluUnit() : '', x.weight != null ? fmtNum(x.weight, 1) + ' kg' : ''].filter(Boolean).join(' · ')}</p>`).join('')}</div>` : ''}
    ${m.length ? `<div class="card answers"><div class="a-q">Essen</div>${m.map(x => `<p>${esc(x.type)}${x.kcal != null ? ' · ' + fmtNum(x.kcal) + ' kcal' : ''}${x.desc ? ' · ' + esc(x.desc) : ''}</p>`).join('')}</div>` : ''}
    ${w.length ? `<div class="card answers"><div class="a-q">Training</div>${w.map(x => `<p>${esc(x.type)} · ${fmtNum(x.dur)} min · ${esc(x.int)}${x.note ? ' · ' + esc(x.note) : ''}</p>`).join('')}</div>` : ''}
    <button class="btn block" data-act="goto-day" data-date="${d}">Diesen Tag bearbeiten</button>
  </div>`);
}

function submitForm(form){
  const kind = form.dataset.form;
  const fd = Object.fromEntries(new FormData(form).entries());
  const err = msg => { const e = form.querySelector('#formErr'); e.textContent = msg; e.hidden = false; };
  const n = k => num(fd[k]);
  const bad = (v, lo, hi) => v != null && (Number.isNaN(v) || v < lo || v > hi);
  let rec, list;
  if (kind === 'vital'){
    const sys = n('sys'), dia = n('dia'), pulse = n('pulse'), weight = n('weight');
    let glu = n('glu');
    if ((sys == null) !== (dia == null)) return err('Bitte beide Blutdruckwerte eintragen (systolisch und diastolisch).');
    if (bad(sys, 60, 260) || bad(dia, 30, 160)) return err('Blutdruck bitte prüfen: erwartet werden Werte wie 120/80.');
    if (sys != null && dia >= sys) return err('Der diastolische Wert muss kleiner als der systolische sein.');
    if (bad(pulse, 25, 230)) return err('Puls bitte prüfen (25–230 bpm).');
    if (glu != null && !Number.isNaN(glu) && gluUnit() === 'mmol/L') glu = Math.round(glu * GLU_F);
    if (bad(glu, 20, 600)) return err('Blutzucker bitte prüfen. Stimmt die Einheit (' + gluUnit() + ')?');
    if (bad(weight, 20, 350)) return err('Gewicht bitte prüfen (in kg).');
    if ([sys, pulse, glu, weight].every(v => v == null)) return err('Bitte mindestens einen Wert eintragen.');
    rec = {sys, dia, pulse, glu: glu == null ? null : Math.round(glu), weight, time: fd.time || '', note: (fd.note || '').trim()};
    list = S.vitals;
  } else if (kind === 'meal'){
    const kcal = n('kcal'), p = n('p'), c = n('c'), f = n('f');
    if ([kcal, p, c, f].some(v => bad(v, 0, 10000))) return err('Bitte nur Zahlen eintragen.');
    const desc = (fd.desc || '').trim();
    if (!desc && kcal == null) return err('Bitte beschreiben, was es gab, oder Kalorien eintragen.');
    rec = {type: fd.type || 'Snack', desc, kcal, p, c, f, time: fd.time || ''};
    list = S.meals;
  } else {
    const dur = n('dur'), dist = n('dist');
    if (dur == null || bad(dur, 1, 1440)) return err('Bitte die Dauer in Minuten eintragen.');
    if (bad(dist, 0, 1000)) return err('Distanz bitte als Zahl in km eintragen.');
    rec = {type: fd.type || 'Sonstiges', int: fd.int || 'mittel', dur, dist, note: (fd.note || '').trim()};
    list = S.workouts;
  }
  if (fd.id){ const i = list.findIndex(x => x.id === fd.id); if (i > -1) list[i] = Object.assign({}, list[i], rec); }
  else list.push(Object.assign({id: uid(), date: sel}, rec));
  if (save()) toast('Gespeichert');
  closeSheet(); render();
}

function deleteEntry(form, id){
  const kind = form.dataset.form;
  const key = kind === 'vital' ? 'vitals' : kind === 'meal' ? 'meals' : 'workouts';
  S[key] = S[key].filter(x => x.id !== id);
  save(); toast('Eintrag gelöscht'); closeSheet(); render();
}

/* =========================================================================
   Sicherung: Export / Import
   ========================================================================= */
async function exportData(){
  flush();
  const payload = {app:'Tagwerk', format:1, exportedAt:new Date().toISOString(), data:S};
  const name = `tagwerk-sicherung-${today()}.json`;
  const blob = new Blob([JSON.stringify(payload)], {type:'application/json'});
  let file = null;
  try { file = new File([blob], name, {type:'application/json'}); } catch(e){}
  try {
    if (file && navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:'Tagwerk-Sicherung'});
      markBackup('Sicherung übergeben. Bitte in „Meine Daten“ ablegen.');
      return;
    }
  } catch(e){
    if (e && e.name === 'AbortError'){ toast('Export abgebrochen'); return; }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  markBackup('Sicherung heruntergeladen.');
}
function markBackup(msg){ S.settings.lastBackup = new Date().toISOString(); save(); toast(msg, 3500); render(); }

function readImport(file){
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const obj = JSON.parse(fr.result);
      const data = obj && obj.data ? obj.data : obj;
      if (!data || typeof data !== 'object' || !('days' in data || 'vitals' in data || 'meals' in data || 'workouts' in data)) throw new Error('fmt');
      pendingImport = normalize(data);
      const dc = Object.values(pendingImport.days).filter(dayHasContent).length;
      openSheet(`${sheetHead('Sicherung importieren', file.name)}
        <div class="stack">
          <div class="sum"><div><b>${dc}</b><span>Tage</span></div><div><b>${pendingImport.vitals.length}</b><span>Messungen</span></div><div><b>${pendingImport.meals.length}</b><span>Mahlzeiten</span></div><div><b>${pendingImport.workouts.length}</b><span>Trainings</span></div></div>
          <p class="small" style="margin:0"><b>Zusammenführen</b> ergänzt fehlende Einträge und behält alles, was schon hier ist. <b>Ersetzen</b> überschreibt den aktuellen Stand komplett.</p>
          <button class="btn block" data-act="import-merge">Zusammenführen</button>
          <button class="btn danger block" data-act="import-replace">Aktuellen Stand ersetzen</button>
        </div>`);
    } catch(e){ toast('Die Datei ist keine gültige Tagwerk-Sicherung.', 4000); }
  };
  fr.onerror = () => toast('Datei konnte nicht gelesen werden.', 4000);
  fr.readAsText(file);
}
function mergeData(a, b){
  for (const [d, bd] of Object.entries(b.days)){
    const ad = a.days[d];
    if (!ad || !dayHasContent(ad)){ a.days[d] = bd; continue; }
    ad.a = ad.a || {};
    for (const [qid, txt] of Object.entries(bd.a || {})){ if (!(ad.a[qid] || '').trim() && txt){ ad.a[qid] = txt; if (!ad.q.includes(qid)) ad.q.push(qid); } }
    if (ad.mood == null) ad.mood = bd.mood ?? null;
    if (ad.energy == null) ad.energy = bd.energy ?? null;
    if (!(ad.note || '').trim()) ad.note = bd.note || '';
    else if ((bd.note || '').trim() && bd.note.trim() !== ad.note.trim()) ad.note += '\n\n' + bd.note;
  }
  for (const k of ['vitals', 'meals', 'workouts']){ const ids = new Set(a[k].map(x => x.id)); b[k].forEach(x => { if (!ids.has(x.id)) a[k].push(x); }); }
  return a;
}

/* =========================================================================
   Ereignisse
   ========================================================================= */
let toastTimer;
function toast(msg, ms = 2200){
  $('#toastRoot').innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { $('#toastRoot').innerHTML = ''; }, ms);
}

$('#tabs').addEventListener('click', e => { const b = e.target.closest('button[data-tab]'); if (b) setTab(b.dataset.tab); });
$('#prevDay').addEventListener('click', () => setDate(addDays(sel, -1)));
$('#nextDay').addEventListener('click', () => setDate(addDays(sel, 1)));
$('#datePick').addEventListener('change', e => { if (e.target.value) setDate(e.target.value); });
$('#importFile').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; if (f) readImport(f); e.target.value = ''; });

document.addEventListener('click', e => {
  const go = e.target.closest('[data-go]');
  if (go){ if (go.dataset.seg) seg = go.dataset.seg; setTab(go.dataset.go); return; }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (act === 'close-bg'){ if (e.target === el) closeSheet(); return; }
  switch (act){
    case 'close': closeSheet(); break;
    case 'scale': {
      const day = ensureDay(sel); const v = Number(el.dataset.val); const f = el.dataset.field;
      day[f] = day[f] === v ? null : v; save();
      el.parentElement.querySelectorAll('button').forEach(b => { const on = Number(b.dataset.val) === day[f]; b.classList.toggle('on', on); b.setAttribute('aria-checked', on); });
      break;
    }
    case 'swap': {
      const day = dayObj(sel);
      if ((day.a[el.dataset.id] || '').trim()){ toast('Erst die Antwort leeren, dann tauschen.'); break; }
      swapQuestion(sel, el.dataset.id); render(); break;
    }
    case 'seg': seg = el.dataset.seg; render(); break;
    case 'range': range = Number(el.dataset.range); render(); break;
    case 'unit': S.settings.glucose = el.dataset.unit; save(); render(); break;
    case 'add': ({vital:sheetVital, meal:sheetMeal, workout:sheetWorkout})[el.dataset.kind](); break;
    case 'edit': {
      const k = el.dataset.kind; const list = k === 'vital' ? S.vitals : k === 'meal' ? S.meals : S.workouts;
      const x = list.find(r => r.id === el.dataset.id); if (x) ({vital:sheetVital, meal:sheetMeal, workout:sheetWorkout})[k](x); break;
    }
    case 'pick': {
      const wrap = el.closest('[data-pick]'); const form = el.closest('form');
      form.querySelector(`input[name="${wrap.dataset.pick}"]`).value = el.dataset.val;
      wrap.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === el)); break;
    }
    case 'del': {
      if (el.dataset.armed){ deleteEntry(el.closest('form'), el.dataset.id); }
      else { el.dataset.armed = '1'; el.textContent = 'Wirklich löschen? Nochmal tippen'; setTimeout(() => { if (el.isConnected){ delete el.dataset.armed; el.textContent = 'Eintrag löschen'; } }, 4000); }
      break;
    }
    case 'day': sheetDay(el.dataset.date); break;
    case 'goto-day': closeSheet(); sel = el.dataset.date; setTab('journal'); break;
    case 'export': exportData(); break;
    case 'import': $('#importFile').click(); break;
    case 'import-merge': S = mergeData(S, pendingImport); pendingImport = null; save(); closeSheet(); toast('Sicherung zusammengeführt'); render(); break;
    case 'import-replace': {
      if (!el.dataset.armed){ el.dataset.armed = '1'; el.textContent = 'Sicher? Nochmal tippen zum Ersetzen'; break; }
      const keep = S.settings.lastBackup; S = pendingImport; S.settings.lastBackup = S.settings.lastBackup || keep; pendingImport = null; save(); closeSheet(); toast('Daten ersetzt'); render(); break;
    }
    case 'wipe':
      openSheet(`${sheetHead('Alle Daten löschen', 'Kann nicht rückgängig gemacht werden')}
        <div class="stack"><p class="small" style="margin:0">Tippe <b>LÖSCHEN</b> ein, um alle Einträge aus diesem Browser zu entfernen.</p>
        <input type="text" id="wipeInput" autocomplete="off" autocapitalize="characters" placeholder="LÖSCHEN">
        <button class="btn danger block" id="wipeBtn" data-act="wipe-confirm" disabled>Endgültig löschen</button></div>`); break;
    case 'wipe-confirm': S = blank(); save(); closeSheet(); toast('Alle Daten gelöscht'); setTab('heute'); break;
  }
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.tagName === 'TEXTAREA') autosize(t);
  if (t.id === 'wipeInput'){ $('#wipeBtn').disabled = t.value.trim().toUpperCase() !== 'LÖSCHEN'; return; }
  const f = t.dataset && t.dataset.field;
  if (!f) return;
  const day = ensureDay(sel);
  if (f === 'answer'){
    const id = t.dataset.id;
    if (t.value.trim()) day.a[id] = t.value; else delete day.a[id];
    t.closest('.q').classList.toggle('done', !!t.value.trim());
    const p = $('#jprog'); if (p) p.textContent = `${answeredCount(day)} von 10 beantwortet · wird automatisch gespeichert`;
  } else if (f === 'note'){ day.note = t.value; }
  saveSoon();
});

document.addEventListener('submit', e => { const f = e.target.closest('form[data-form]'); if (f){ e.preventDefault(); submitForm(f); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#sheetRoot').innerHTML) closeSheet(); });

/* Tageswechsel, wenn die App über Nacht offen bleibt */
let lastToday = today();
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && today() !== lastToday){ if (sel === lastToday) sel = today(); lastToday = today(); render(); }
});

render();

if ('serviceWorker' in navigator && location.protocol === 'https:'){
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
